[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htr-genealogia"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"recognition.htr" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
